# For NvSciIpc, we use Posix Message Queue for notification and we set
# maximum message to the number of frames that any endpoint can handle.
# Default value of maximum message is 10 and if we want to change that
# then one needs root privilege. In order to avoid needing root
# privilege, setting the default to 64 (which is maximum frame configured
# for any INTER_PROCESS/INTER_THREAD endpoints).
fs.mqueue.msg_max = 64
