target_type: 'aprilgrid'
tagCols: 6
tagRows: 6
tagSize: 0.088
tagSpacing: 0.3

# =====================================================================
# 标定板定义（Kalibr 格式），对应你手上打印的 AprilGrid 6x6 tag=88mm。
#
# 字段含义：
#   target_type : aprilgrid（AprilTag 阵列，family 默认 36h11）
#   tagCols     : 横向 tag 数 = 6
#   tagRows     : 纵向 tag 数 = 6
#   tagSize     : 单个黑色 tag 的边长（米）= 0.088（即 88mm）
#   tagSpacing  : 相邻 tag 之间白色间隙 与 tagSize 的比值（无量纲）
#
# ---------------------------------------------------------------------
# 【必须用尺子实测确认，别照抄 0.3 和 0.088！打印/缩放会有误差】
#
# 1) 量 tagSize：
#    用卡尺或钢尺量任意一个黑色方块（tag 本体，不含外面白边）的边长，
#    单位换算成米。若打印出来不是 88mm，把 tagSize 改成实测值。
#    例：量得 87.4mm → tagSize: 0.0874
#
# 2) 量 tagSpacing（关键，最容易错）：
#    量“相邻两个黑色 tag 之间的白色间隙宽度” g（毫米），
#    tagSpacing = g / (tagSize_mm)
#    标准 AprilGrid 的间隙 = 0.3 * tagSize，即 88mm 板对应间隙 ≈ 26.4mm。
#    实测例：间隙量得 26.4mm，tagSize 88mm → 26.4/88 = 0.30 ✓
#    实测例：间隙量得 22.0mm，tagSize 88mm → 22.0/88 = 0.25 → 改成 0.25
#
#    小技巧：量“同一行里，一个 tag 左边缘到下一个 tag 左边缘”的中心距 P（pitch），
#    则 tagSpacing = P/tagSize - 1。这个量法比量细缝更准。
#    例：P 量得 114.4mm，tagSize 88mm → 114.4/88 - 1 = 0.30 ✓
#
# 3) tagSize 和 tagSpacing 两个数直接决定尺度，量错会让外参平移量整体带比例误差，
#    务必用同一把尺、同一单位，反复量 2~3 个 tag 取平均。
# =====================================================================
